name: sitex
channels:
  - conda-forge
dependencies:
  - python=3.10
  # Compiled geospatial stack: install from conda-forge, not pip
  - geopandas
  - rasterio
  - shapely
  - pyproj
  - fiona
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - matplotlib
  - jupyterlab
  - ipywidgets
  - pydeck            # 3D building view in 01-SITE-3D_Model
  - pip
  - pip:
      # SiteX and the rest of its dependencies (pure Python or wheels)
      - "sitex[arch,env,network,viz,data] @ git+https://github.com/ArchiColab/sitex.git"
