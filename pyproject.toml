[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sitex"
version = "0.1.0"
description = "Open-data site analysis toolkit for urban design students working in data-scarce contexts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Chau Nguyen", email = "nmc.arch@gmail.com" },
]
dependencies = [
    "pyproj>=3.7",
    "numpy>=1.24",
    "Pillow>=10.0",
]

[project.optional-dependencies]
arch = [
    "rioxarray>=0.15",
    "geopandas>=0.14",
    "shapely>=2.0",
    "scipy>=1.11",
    "ezdxf>=1.1",
    "matplotlib>=3.8",
    "folium>=0.15",
    "momepy>=0.7",
    "networkx>=3.0",
    "rasterio>=1.3",
    "trimesh>=4.0",
    "osmnx>=1.9",          # sitex.data.aoi (place -> centre for CityConfig)
    "pyarrow>=14.0",       # Parquet / GeoParquet export of the hexagon tables
]
env = [
    "rioxarray>=0.15",
    "scipy>=1.11",
    "numpy>=1.24",
    "rasterio>=1.3",
    "geopandas>=0.14",
    "shapely>=2.0",
    "folium>=0.15",
    "matplotlib>=3.8",
    "scikit-learn>=1.3",
    "osmnx>=1.9",          # sitex.data.aoi (CityConfig) is imported by the env notebooks
    "pyarrow>=14.0",       # Parquet export of the hexagon tables
]
network = [
    "geopandas>=0.14",
    "shapely>=2.0",
    "networkx>=3.0",
    "igraph>=0.10",        # fast segment choice and integration (spacesyntax); optional, slow loop without it
    "folium>=0.15",
    "matplotlib>=3.8",
    "ezdxf>=1.1",
    "pandas>=2.0",
    "osmnx>=1.9",
    "rasterio>=1.3",       # WorldCover green patches (green_accessibility)
    "h3>=4.0",
    "inequality>=1.0",
    "scipy>=1.11",
    "numpy>=1.24",
    "leafmap>=0.30",
    "ipyleaflet>=0.19",
    "ipywidgets>=8.0",
]
viz = [
    "geopandas>=0.14",
    "shapely>=2.0",
    "rasterio>=1.3",
    "folium>=0.15",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "numpy>=1.24",
    "pandas>=2.0",
    "trimesh>=4.0",
    "plotly>=5.20",
]
data = [
    "geopandas>=0.14",
    "shapely>=2.0",
    "rasterio>=1.3",
    "osmnx>=1.9",
    "leafmap>=0.30",
    "ipyleaflet>=0.19",
    "ipywidgets>=8.0",
    "openeo>=0.31",
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "duckdb>=1.0",
    "h3>=4.0",             # sitex.core.hexgrid (shared hex grid built in 00-Data-Acquisition)
    "fiona>=1.9",
    "folium>=0.15",
    "requests>=2.31",
    "s2sphere>=0.2.5",     # Open Buildings S2 tokens (sitex.data.open_buildings)
]
hex = [
    "duckdb>=1.0",        # 05-INT-Hex_Integration: the hexagon database
    "pyarrow>=14.0",      # read and write Parquet / GeoParquet
    "geopandas>=0.14",
    "pandas>=2.0",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sitex"]
